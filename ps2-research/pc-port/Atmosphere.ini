; ATMOSPHERE1 experimental, default Classic. Independent of dinput8.dll.
; Read at startup, except SkyPreset is reread at the next race initialization.
[Atmosphere]
Enabled=0
; Auto or a single digit 0..5. Preserves the native replay/used/cycle writes.
SkyPreset=Auto
; Optional directory with clouds.dxt and layer.dxt (256x256 native FEED/BGRA8).
; Original cylinder/UVs/alpha masks only. Empty = original textures.
CustomSet=
CustomBase=3
; Narrow terrain-only prototype; vehicles get the changed scene in reflections.
WorldLighting=0
; Moving point-source test on the same admitted prelit terrain. World coordinates.
LightProbe=0
LightX=0
LightY=0
LightZ=0
LightRadius=12
; Reserved. Effects are suppressed until real current-frame depth visibility is proven.
Sun=0
SunFlare=0
