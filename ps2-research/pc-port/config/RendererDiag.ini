; Debug and research switches of the renderer (PS2Port.ini ConfigVersion = 3).
; Optional: without this file every value below takes its default. Read at process start.

[Diagnostics]
; 0 = Off
; 1 = Feature records in MRRRenderer\logs and F10 sidecars
Diagnostics = 0
; 0 = Off
; 1 = Reflection stage records and PNGs for the first captures of each race
ReflectionStageDiag = 0
; 0 = Off
; 1 = Hay bale / tumbleweed physics records
RigidPropsDiagnostics = 0
; 0 = Off
; 1 = Per-effect timing and frame time every PerfWindow frames; PerfBypassKey cycles the A/B bypass
PerfTiming = 0
PerfWindow = 300
; Virtual-key code (118 = F7)
PerfBypassKey = 118
; Atmosphere A/B key (117 = F6; F8 is the free camera): none, headlights, lamp_glints, sun_fx, ring_upload, world_native, bodies, all
PerfAtmosphereKey = 117

[Reflections]
; 0 = Off
; 1 = Test pattern instead of the reflection
; 2 = Show the 64x64 environment target (screenshots only)
ReflectionDebug = 0
; 0 = Engine draw order
; 1 = Course first, cars last (live reflection)
ReflectionWorldFirst = 1
; 0 = Accepted orientation
; 1 = Flipped source reflection
SourceReflectionVFlip = 1

[Tuning]
; Weight of the previous frame per 50 Hz frame (0..0.9)
MotionBlurStrength = 0.195
; k for R,G,B in y = (1-k)x + kx^2
ColorCurve = 0.426,0.384,0.364
; ForestFix = 2 only: texels with alpha at or below this value are dropped (1..254)
ForestFixAlphaRef = 32

[CollisionDebug]
; 0 = Off
; 1 = Collision overlay available on CollisionDebugKey
CollisionDebug = 0
CollisionDebugKey = F11
; Overlay at start; the key cycles OFF, SURFACE, WIRE, X-RAY, SLOPE, FACING, SOLID, OBJECTS
; OFF = Hidden until the key is pressed
; SURFACE = Visible at once
CollisionDebugMode = OFF
CollisionDebugRange = 500
CollisionDebugDepthPull = 0.003
CollisionDebugLegend = 1
CollisionDebugLegendPosition = TOPCENTER
; 0 = Off
; 1 = Car hulls and wheel cylinders available on CollisionDebugCarsKey (hidden at start)
CollisionDebugCars = 0
CollisionDebugCarsKey = F9
CollisionDebugMarkersKey = F12

[Compatibility]
; 0 = Retail EXE only
; 1 = Accept in-place mods of the retail EXE (CollisionDebug only on them)
RetailDerivativeBuilds = 1
; 0 = Only CollisionDebug on modded EXEs
; 1 = Every effect on modded EXEs too
RetailDerivativeEffects = 0
; 0 = Free camera, Clean View and HUD hide in Quick Race only
; 1 = In every race mode (also switches PS2Port.ini RaceAllModes on)
BaselineAllRaceModes = 1
