; R-SURFACE1 Vehicle Grime - renderer-only configuration (d3d8.dll). Place next to MRallye.exe.
; Independent of Atmosphere.ini, PS2Port.ini and the Extra Options loader (dinput8.dll).
[VehicleGrime]
; G0 diagnostics: log particle surface exposure per car and Master Rallye mode save state to
; MRRRenderer\logs\grime-*.jsonl. Observation only: no draw or device state is changed.
Probe=1
; G1 visual layer: 1 = draw grime over car bodies (Atmosphere body route; Atmosphere BodyPrototype=Materials).
; 0 = no extra pass at all (identical frame).
Enabled=0
; G1 static look: grime level of every car (0 = clean, 0.5 = patches, 1 = full lower body) and dust->mud mix.
StartLevel=0.55
StartMud=0.0
; G2 dynamics: 1 = every car (AI included) gets its own grime from the surface it drives on: dust, mud, stones and
; grass particles near the car build it up, water splashes wet and wash it, wet dries in DryTime seconds and mud
; lightens as it dries. 0 = the fixed G1 look (StartLevel/StartMud for every car).
Dynamic=1
; Dynamic start state of a Quick Race / attract car (0 = clean). Master Rallye mode restores the saved checkpoint.
RaceStart=0.0
; Accumulation multiplier (dust, mud, stones, grass), and drying time of wet (seconds).
Rate=1.0
DryTime=45
; Bodies farther than this (metres) skip the pass.
MaxDistance=80
; Diagnostics: log every car material once with its grime decision (grime_census in the session log).
Census=0
; Particle-to-car attribution radius in centimetres, and the exposure sample period.
ProbeRadiusCm=400
SampleMs=500

[Persistence]
; Master Rallye mode: keep the grime of a stage when the stage is left and loaded again
; (G0 = dry run: values are computed, stored and restored only in the log).
MasterRallye=1
Store=MRRRenderer\grime\master-rallye-grime.txt

[Service]
; Reserved for the Service Park (G4): wash fraction applied by a future service action.
WashFraction=1.0

[Look]
; Grime tints (0..1 RGB). Lit by the body's own vertex lighting.
DustRGB=0.68,0.57,0.43
MudRGB=0.30,0.24,0.17
; G2.1: opacity of a fully dusty patch (mud is always opaque): thin dust dims the paint and its reflection
; instead of hiding them.
DustOpacity=0.8
; Share of the surface colour (taken from the particles that hit the car) in the dust/mud tint; 0 = the RGB values above.
SurfaceTint=0.75
; Colour deposited by driving on grass (the grass particles are brown).
GrassRGB=0.34,0.42,0.18
; G3: 1 = the windscreen wiper arcs stay clean.
Wipers=1
; G3: wet sheen of a fully wet car (water crossings), 0 = off. Dries with DryTime.
Sheen=0.35
