[General]
ConfigVersion = 3

[Scope]
; 0 = Quick Race and single-car races
; 1 = Also Master Rallye, Rallye Cup, Challenge, Invitation and replays
RaceAllModes = 1
; 0 = Split screen stays PC
; 1 = Effects in split screen too
SplitScreen = 1

[Vehicles]
; 0 = PC cars
; 1 = PS2 car models in races
RaceFleet = 1
; 0 = Player car only
; 1 = Every AI car too
FleetAllCars = 1
; 0 = PC menu cars
; 1 = PS2 models for every car in menus and showroom
FrontendModel = 1
; 0 = PC full-bright look
; 1 = PS2 body lighting
VehicleLighting = 1
; 0 = Original PS2 content
; 1 = Fix PS2 model defects (Navara co-driver, Tata/Kamaz windows)
ContentFixes = 1
; 0 = PC brake lamps
; 1 = Lamp glow
BrakeGlow = 1

[Reflections]
; 0 = PC
; 1 = Live reflection of the course (one frame copy per frame)
Reflection = 1
; 0 = Original subset of materials
; 1 = Every reflective material
ReflectionCoverage = 1
; 0 = 32-bit reflection target
; 1 = 16-bit (PS2-like)
ReflectionTargetPrecision = 1
; With Reflection = 0 only:
; 0 = Live meshes keep the PC reflection
; 1 = Static environment map on them
UniformReflection = 0

[Course]
; 0 = Off
; 1 = Grass
Grass = 1
; 0 = Off
; 1 = Shrubs
Shrubs = 1
; 0 = PC ground noise
; 1 = Exact (2 passes)
; 2 = Fast (1 pass, noise fades in fog)
GroundDetail = 2
; 0 = PC forest cards
; 1 = No cut-outs between tree layers
; 2 = Alpha test instead (keeps depth)
ForestFix = 1
; 0 = PC water
; 1 = Water, puddles and waterfalls
Water = 1
; 0 = Off
; 1 = Moving objects (boats, barges, airships)
SplineObjects = 1
; 0 = Off
; 1 = Birds
Birds = 1
; 0 = Off
; 1 = Hay bales and tumbleweeds you can knock over
RigidProps = 1
; 0 = PC checkpoint boards
; 1 = Checkpoint barrels
CheckpointBarrels = 1

[HUD]
; 0 = PC
; 1 = Damage row and damage icon
HudDamage = 1
; 0 = PC round GPS
; 1 = Square map
HudMap = 1
; 0 = PC
; 1 = Art on speed dial, needle and progress bar
HudTemplate = 1
; 0 = Keep
; 1 = Hide HUD parts the PS2 does not have
HudHidePcOnly = 1
; 0 = PC
; 1 = Opponent time list
HudTimeDiffs = 1
; 0 = PC
; 1 = Split time flash
HudSplitFlash = 1

[Picture]
; 0 = Off
; 1 = Motion trail in races
MotionBlur = 1
; 0 = Off
; 1 = Colour curve (whole frame incl. HUD)
Color = 0
; 0 = Off
; 1 = Soft TV output (whole frame incl. HUD)
Output = 0

[Rules]
; 0 = PC off-course reset (~12 ticks)
; 1 = Reset ~2 ticks after the border
ResetTiming = 1
; 0 = PC checkpoint sound
; 1 = Silent checkpoints
CheckpointSoundOff = 1
; 0 = PC finish jingle
; 1 = Race music keeps playing after the finish
FinishMusic = 1
