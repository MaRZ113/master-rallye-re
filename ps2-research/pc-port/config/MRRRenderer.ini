[General]
ConfigVersion = 2

[Display]
; 0 = Stock - Original game window/mode
; 1 = Windowed - Resizable window
; 2 = Borderless - Fullscreen-like window at the monitor size (recommended)
; 3 = Exclusive - Experimental, restore after Alt+Tab is known broken
Mode = 2
; Window size in pixels
; 0 = Automatic (game size in Windowed, monitor size in Borderless)
Width = 0
Height = 0
; Refresh rate in Hz
; 0 = Desktop
RefreshRate = 0
; 0 = Cursor stays visible
; 1 = Hide the cursor after a short pause (Borderless/Exclusive)
AutoHideCursor = 1
; Delay before the cursor hides, in milliseconds
CursorHideDelayMs = 1500

[Quality]
; 0 = Stock - Base PC look, no renderer improvements (for comparison)
; 1 = Classic+ - MSAA 4x, anisotropy 16x, widescreen HUD, 60 degree FOV
; 2 = Custom - Use the values below
Preset = 2
; 0 = Off
; 2 = MSAA 2x
; 4 = MSAA 4x
; 8 = MSAA 8x (falls back to the highest supported)
AntiAliasing = 4
; 0 = Off (trilinear)
; 2 = Anisotropic 2x
; 4 = Anisotropic 4x
; 8 = Anisotropic 8x
; 16 = Anisotropic 16x
Anisotropy = 16
; 0 = Stock 4:3 stretch
; 1 = Centered 4:3
; 2 = Widescreen, HUD keeps its margins (recommended)
Widescreen = 2
; 0 = Stock lens
; 1 = Use VerticalFOVDegrees
GameplayFOV = 1
; Vertical field of view in degrees (30..110)
VerticalFOVDegrees = 60
; 0 = Stock shadows
; 1 = No shadows
Shadows = 0

[HUD]
; Key that hides or shows the HUD during a race
ToggleKey = H
; 0 = HUD visible at start
; 1 = HUD hidden at start
HiddenAtStartup = 0
; Paused race with the stock camera:
; 0 = H hides every verified UI draw
; 1 = H hides the race HUD, the pause window stays
PreservePause = 0

[FreeCamera]
; 0 = Off
; 1 = On
Enabled = 1
; 0 = Fly only while the race is paused
; 1 = Fly in a running race too
AllowUnpaused = 1
; 0 = WASD + E/Q
; 1 = Numpad
; 2 = Custom keys from [FreeCameraKeys]
ControlPreset = 0
; Key that starts and stops the free camera
ToggleKey = F8
; Speed in world units per second; mouse wheel changes it between Min and Max
MoveSpeed = 40.0
MinMoveSpeed = 0.25
MaxMoveSpeed = 300.0
WheelSpeedFactor = 1.25
; Smoothing of the movement in seconds
; 0 = Instant
MovementSmoothSeconds = 0.12
; Speed factors while Fast / Slow is held
FastMultiplier = 6.0
SlowMultiplier = 0.20
MouseSensitivity = 0.12
; 0 = Keep the native camera roll
; 1 = Level the horizon after activation
AutoLevelHorizon = 1
HorizonLevelSeconds = 0.30
; 0 = Free camera uses the gameplay FOV
; 1 = Own lens, changed with FOVDecrease/FOVIncrease
CinematicFOVEnabled = 1
; 0 = Start with CinematicVerticalFOVDegrees
; 1 = Start with the stock camera lens
InheritStockFOVOnToggle = 1
; Start lens in degrees
; 0 = Inherit the gameplay FOV
CinematicVerticalFOVDegrees = 0
MinVerticalFOVDegrees = 35
MaxVerticalFOVDegrees = 100
FOVStepDegrees = 5
FOVSmoothSeconds = 0.25
; 0 = No manual banking
; 1 = RollLeft/RollRight bank the camera
ManualRollEnabled = 1
RollSpeedDegreesPerSecond = 45.0
RollSmoothSeconds = 0.10
MaxRollDegrees = 90.0
; 0 = Off
; 1 = Three camera bookmarks per course (Save/Load/NextSlot keys)
CameraBookmarksEnabled = 1
CameraBookmarkDefaultSlot = 1
; 0 = H does nothing in the paused free camera
; 1 = H hides the pause menu for clean shots
CleanViewPilot = 1

[FreeCameraKeys]
; Used with ControlPreset = 2 (movement) and always for the extra keys
Forward = W
Backward = S
Left = A
Right = D
Up = E
Down = Q
Fast = LeftShift
Slow = LeftAlt
SpeedIncrease = PageUp
SpeedDecrease = PageDown
FOVDecrease = Z
FOVIncrease = X
RollLeft = C
RollRight = V
RollReset = B
SaveCameraBookmark = J
LoadCameraBookmark = K
NextCameraBookmarkSlot = L

[ProbeTeleport]
; Ctrl+Alt+1..9 moves the player car to PointN = x,y,z,yawDegrees
; (y = ground height + about 1.5). Stop the car first; speed is not reset.
; 0 = Off
; 1 = On (needs [PhysicsObserver] Enabled = 1)
Enabled = 1
; FranceM airship, race line marker 234
Point1 = -912.8,46.5,410.2,0
; ItalyW2 boat, race line marker 12
Point2 = 3047.7,-56.8,874.9,0
; SpainS2 boat1, race line marker 41
Point3 = 2042.2,28.7,567.7,0
; SpainS2 boat5, race line marker 74
Point4 = 1718.9,30.1,408.7,0
Point5 = 2369.6,31.4,-843.6,0
Point6 = 3414.4,52.8,-716.2,0
Point7 = 1955.9,35.3,-160.6,0
Point8 = 2368.2,45.5,-681.4,0
Point9 = 2337.3,59.3,-673.5,0

[PhysicsObserver]
; Read-only observer of the native car recovery; required by ProbeTeleport
; 0 = Off
; 1 = On
Enabled = 1

[Compatibility]
; 0 = Off
; 1 = Fix the frontend menu freeze (verified retail EXE only)
MenuFreezeFix = 1

[Diagnostics]
; 0 = Off
; 1 = Write MRRRenderer\logs\crash-<pid>.txt on a crash
CrashLog = 1
; 0 = Off
; 1 = Developer trace: F10 frame capture and frame summaries (costs FPS)
Trace = 0
