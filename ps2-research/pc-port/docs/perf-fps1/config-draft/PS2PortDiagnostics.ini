; Developer and research switches. Optional: without this file every value below is 0 / default.
; Read beside PS2Port.ini at process start.
[Diagnostics]
; 1 = feature records in MRRRenderer\logs and F10 sidecars.
Diagnostics = 0
; 1 = reflection stage records and PNGs for the first captures of each race.
ReflectionStageDiag = 0
; 1 = hay bale / tumbleweed physics records.
RigidPropsDiagnostics = 0
; 1 = per-effect timing and frame time every PS2PerfWindow frames; F7 cycles the A/B bypass.
PS2PerfTiming = 0
PS2PerfWindow = 300
PS2PerfBypassKey = 118

[Reflections]
; 1 = test pattern, 2 = show the 64x64 env target. Screenshots only.
ReflectionDebug = 0
ReflectionWorldFirst = 1
SourceReflectionVFlip = 0

[Tuning]
PS2MotionBlurStrength = 0.195
PS2ColorCurve = 0.426,0.384,0.364
; Forest cards: texels with alpha at or below this value are dropped (1..254).
ForestFixAlphaRef = 32
; Retired pilot (France1 bush01), superseded by ForestFix.
Foliage = 0
; Pilot: extra non-physical PS2 puddles on Turkey3 only.
CourseObjects = 0

[CollisionDebug]
CollisionDebug = 0
CollisionDebugKey = F11
CollisionDebugMode = SURFACE
CollisionDebugRange = 500
CollisionDebugDepthPull = 0.003
CollisionDebugLegend = 1
CollisionDebugLegendPosition = TOPCENTER
CollisionDebugCars = 0
CollisionDebugCarsKey = F9
CollisionDebugMarkersKey = F12

[Compatibility]
RetailDerivativeBuilds = 1
RetailDerivativeEffects = 0
BaselineAllRaceModes = 1
