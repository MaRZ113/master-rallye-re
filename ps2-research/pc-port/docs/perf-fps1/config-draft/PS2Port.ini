[General]
ConfigVersion = 3

[Scope]
; 0 = Quick Race and single-car races; 1 = also Master Rallye, Rallye Cup, Challenge, Invitation, replays.
PS2RaceAllModes = 1
; 0 = split screen stays PC; 1 = PS2 features in split screen.
PS2SplitScreen = 1

[Vehicles]
; 0 = PC cars; 1 = PS2 models in races.
RaceFleet = 1
; 0 = player car only; 1 = every AI car.
PS2FleetAllCars = 1
; 0 = PC menu car; 1 = PS2 model in menus and showroom.
FrontendModel = 1
; 0 = one car per menu screen; 1 = every car shown at once (Challenge preview).
PS2FrontendAllCars = 1
; 0 = PC full-bright look; 1 = PS2 body lighting.
VehicleLighting = 1
; 0 = original PS2 content; 1 = fix PS2 model defects (Navara co-driver, Tata/Kamaz windows).
PS2ContentFixes = 1
; 0 = PC brake lamps; 1 = PS2 lamp glow.
BrakeGlow = 1

[Reflections]
; 0 = PC; 1 = PS2 live reflection of the course (one frame copy per frame).
Reflection = 1
; 0 = original subset of materials; 1 = every reflective material.
ReflectionCoverage = 1
; 0 = 32-bit reflection target; 1 = 16-bit (PS2-like).
ReflectionTargetPrecision = 1
; 0 = live meshes keep PC reflection; 1 = PS2 static map on them (with Reflection = 0).
PS2UniformReflection = 0

[Course]
; 0 = off; 1 = PS2 grass.
Grass = 1
; 0 = off; 1 = PS2 shrubs.
Shrubs = 1
; 0 = PC ground noise; 1 = PS2 exact (2 passes); 2 = PS2 fast (1 pass, noise fades in fog).
GroundDetail = 2
; 0 = PC forest cards; 1 = no cut-outs between tree layers.
ForestFix = 1
; 0 = PC water; 1 = PS2 water.
PS2Water = 1
; 0 = off; 1 = PS2 moving objects (boats, airship, ...).
SplineObjects = 1
; 0 = off; 1 = PS2 birds.
PS2Birds = 1
; 0 = off; 1 = hay bales and tumbleweeds you can knock over.
RigidProps = 1
; 0 = PC checkpoint boards; 1 = PS2 checkpoint barrels.
PS2CheckpointBarrels = 1

[HUD]
; 0 = PC; 1 = PS2 damage row and damage icon.
PS2HudDamage = 1
; 0 = PC round GPS; 1 = PS2 square map.
PS2HudMap = 1
; 0 = PC; 1 = PS2 art on speed dial, needle and progress bar.
PS2HudTemplate = 1
; 0 = keep; 1 = hide HUD parts the PS2 does not have.
PS2HudHidePcOnly = 1
; 0 = PC; 1 = PS2 opponent time list.
PS2HudTimeDiffs = 1
; 0 = PC; 1 = PS2 split time flash.
PS2HudSplitFlash = 1

[Picture]
; 0 = off; 1 = PS2 motion trail in races.
PS2MotionBlur = 1
; 0 = off; 1 = PS2 colour curve (whole frame incl. HUD).
PS2Color = 0
; 0 = off; 1 = soft PS2 TV output (whole frame incl. HUD).
PS2Output = 0

[Rules]
; 0 = PC off-course reset (~12 ticks); 1 = PS2 reset (~2 ticks after the border).
PS2ResetTiming = 1
; 0 = PC; 1 = silent checkpoints (PS2).
PS2CheckpointSoundOff = 1
; 0 = PC finish jingle; 1 = race music keeps playing (PS2).
PS2FinishMusic = 1
