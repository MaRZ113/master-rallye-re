[General]
ConfigVersion = 2

[Display]
; 0 = Stock      - Original game window/mode.
; 1 = Windowed   - Resizable window.
; 2 = Borderless - Fullscreen-like window at the monitor size (recommended).
; 3 = Exclusive  - Experimental; restore after Alt+Tab is known broken.
Mode = 2
; 0 = Automatic (game size in Windowed, monitor size in Borderless).
Width = 0
Height = 0
RefreshRate=0

AutoHideCursor=1

[Quality]
; 0 = Stock - Base PC look, no proxy improvements (for comparison).
; 1 = Classic+ - Anti-aliasing 4x, anisotropy 16x, widescreen HUD, 60 degree FOV.
; 2 = Custom - Use the values below.
Preset = 2
; 0 = Off
; 2 = MSAA 2x
; 4 = MSAA 4x
; 8 = MSAA 8x (falls back to the highest supported).
AntiAliasing = 4
; 0 = Off (trilinear)
; 2 = Anisotropic 2x
; 4 = Anisotropic 4x
; 8 = Anisotropic 8x
; 16 = Anisotropic 16x
Anisotropy = 16
; 0 = Stock 4:3 stretch.
; 1 = Centered 4:3.
; 2 = Widescreen, HUD keeps its margins (recommended).
Widescreen = 2
; 0 = Stock lens; 30..110 = vertical field of view in degrees.
GameplayFOV=1
VerticalFOVDegrees=60
; 0 = Stock shadows.
; 1 = No shadows.
Shadows = 0

[HUD]
; Key that hides or shows the HUD during a race.
ToggleKey = H

[FreeCamera]
; 0 = Off.
; 1 = On: F8 toggles, WASD + E/Q fly, mouse looks, H hides the HUD.
Enabled = 1

[Logging]
; 0 = Off.
; 1 = Troubleshooting log beside the game files (MRRRenderer\logs).
; 2 = Developer trace (F10 frame capture, costs FPS). Restart after changing.
Level = 0
