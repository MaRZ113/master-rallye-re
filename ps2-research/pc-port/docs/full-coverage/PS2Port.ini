; Opt-in visual expansion preset. For the PS2-enabled DLL only.
; Copy manually beside MRRRenderer.ini. No game files are changed by this preset.
; Paths below are relative to this INI; private extracted assets are required.
; ReflectionMode=4 requires a32-bit main backbuffer; NONE/2x/4x are driver-gated.
; This is an approximation, not confirmed pixel-exact PS2 parity.
[PS2Port]
; Keep the foliage experiment and pixel readback disabled.
FoliageMode=0
PixelProbe=0
PixelX=-1
PixelY=-1
PixelLaterDrawOrdinal=-1
Diagnostics=0

; Mixed environment/framebuffer reflection: all174 verified reflective source material groups.
ReflectionMode=4
ReflectionConfigVersion=1
ReflectionCoverage=1
; Runtime-accepted16-bit target. Use0 for the32-bit A/B control.
ReflectionTargetPrecision=1
ReflectionSourceGXI=PS2Grass/PS2EnvSource64x64.gxi
ReflectionDiagnostics=0

; Additional original-source puddles: Turkey3 only.
CourseObjectsMode=1
CourseObjectsVersion=1
CourseObjectsAsset=PS2Grass/Turkey3Puddles.ps2obj
CourseObjectsDiagnostics=0

; Source-derived grass and shrubs: all36 verified course pairs.
GrassMode=2
GrassConfigVersion=1
GrassAsset=PS2Grass/Turkey3Grass.ps2grass
GrassAssetDirectory=PS2Grass
GrassSpriteHalfSize=0.33
GrassDiagnostics=0

ShrubsMode=2
ShrubsConfigVersion=1
ShrubsAsset=PS2Grass/Turkey3Shrubs.ps2grass
ShrubsSpriteHalfSize=0.4
ShrubsDiagnostics=0

; Required local files beside this INI:
; PS2EnvSource64x64.gxi
; Turkey3Puddles.ps2obj
; PS2Grass/: copy all72 verified *.ps2grass files from the local ignored asset directory.
; Missing/corrupt assets fail closed; no automatic deployment or downloading.
