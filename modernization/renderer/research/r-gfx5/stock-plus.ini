; Numeric selectors are canonical; existing text names remain accepted.
; Opt-in Classic+ preset. Restart after edits; keep reflections Stock for comparison.
[Renderer]
ConfigVersion=1

[Display]
; Windowed Width/Height are the NORMAL target; 0/0 pins the first game size.
; Maximized uses actual CLIENT size without changing the normal target.
; Exclusive validates a display target; 0/0 keeps the first accepted game mode.
; Borderless 0/0 uses the native monitor size.
; 0 = Stock
; 1 = Windowed
; 2 = Borderless
; 3 = ExclusiveFullscreen
Mode=2
Width=0
Height=0
RefreshRate=0
; Managed only in Borderless/ExclusiveFullscreen while foreground/inside.
; 0 = Off
; 1 = On
AutoHideCursor=1
CursorHideDelayMs=1500

[Widescreen]
; Centered4x3 is the stable recommended widescreen mode.
; PreserveMargins v2 is runtime-confirmed; it uses a draw-local WORLD copy.
; V2 uses a draw-local WORLD copy; packet coordinates remain untouched.
; Source45 frontend preview correction is separate from gameplay VFOV.
; 0 = Stock
; 1 = Centered4x3
; 2 = PreserveMargins
InterfaceMode=1

[Filtering]
; 0 = Off
; 1 = On
AnisotropicFiltering=1
MaxAnisotropy=16

[AntiAliasing]
; 0 = Stock
; 1 = MSAA
Mode=1
; Used only when Mode=1. Samples alone does not enable AA.
; Supported color+depth sample count <= request; startup logs show acceptance.
Samples=4

[Camera]
; 0 = Off
; 1 = On
GameplayFOV=1
VerticalFOVDegrees=80.0

[Shadows]
; 0 = Stock
; 1 = Off
Mode=0

[VehicleReflections]
; Locally validated vehicle proof is required.
; 0 = Stock
; 1 = ViewDependent2D
Mode=0

[Compatibility]
; Verified local owner, process-memory only; modified EXEs may be compatible.
; Already-patched owner is reported without a write.
; 0 = Off
; 1 = On
MenuFreezeFix=1

[Trace]
; 0 = Off
; 1 = On
Enabled=1
; 0 = Off
; 1 = On
FrameSummaries=1
