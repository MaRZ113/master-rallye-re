; Master Rallye Randomizer & AI Extender - public ConfigVersion 2 example.
; Save beside MRallye.exe. Comments must stay on separate lines from values.

[General]
ConfigVersion = 2

[Randomizer]
; Apply this vertical numeric legend to each of the five mode keys below:
; 0 = Stock
; 1 = T1
; 2 = T2
; 3 = T3
; 4 = Full
; 5 = Mixed
; 6 = Diverse
; Stock keeps native class selection. T1/T2/T3 restrict eligible AI class.
; Full selects from verified eligible classes; Mixed chooses class first.
; Diverse cycles through a shuffled class sequence.
; Full, Mixed, and Diverse are distinct policies, not aliases.
; QuickRace controls Quick Race opponent vehicle selection.
QuickRace = 4
; RallyeCup controls new Rallye Cup opponent roster generation.
RallyeCup = 4
; MasterRallye controls new Master Rallye competition roster generation.
MasterRallye = 4
; Invitation controls the eligible ordinary T3 pool for Invitation.
Invitation = 4
; Challenge controls a newly created Challenge preview and its race opponent.
Challenge = 4
; 0 = Never repeat a physical vehicle ID; 1 = repeat only when needed.
; Repeated cars are separate participants with native driver selection.
Duplicates = 1

[Opponents]
; Maximum selectable Quick Race AI count, not a forced opponent count.
; Five AI means six total vehicles including the player. Restart to change menu.
; Seven AI has known instability with some T1/T2 player-car setups.
MaxOpponents = 5

[Addons]
; 0 = stock vehicles. 1 = verified registered provider, if one is present.
; This standalone release has no complete Vehicle SDK integration; use 0.
Include = 0

[Logging]
; 0 = off; 1 = write a troubleshooting log beside the game files.
; Restart after changing logging.
Enabled = 0

; Randomizer policies and Duplicates reload at the next new roster boundary.
; Existing races and saved events keep their current participants.
; Challenge Preview stays synchronized with the opponent used in its race.
; MaxOpponents, Addons.Include, and Logging.Enabled require a restart.
; Invalid or partial edits are rejected; the last valid running settings remain.
; Quick Race count is selected in the game; this setting only sets its ceiling.
; Invitation uses its ordinary eligible T3 pool; bonus cars are not auto-added.
; Use the exact supported retail game build. The original EXE stays unchanged.
; Save edits as plain ASCII text and leave comments on their own lines.
; Create a new race or event to use a changed Randomizer policy.
; A saved competition is not rewritten when you edit this file.
; Values 4 through 7 may be selected in Quick Race when the menu is expanded.
; This setting never puts extra opponents into Cup, Master Rallye or Challenge.
; Choose Stock for a mode when you want its native vehicle-class selection.
; Full, Mixed and Diverse use different selection rules and remain separate.
; A class policy controls eligible AI cars, not the player's selected vehicle.
; Logs are optional; enable them only when troubleshooting is needed.
; A missing provider means Include=1 adds no vehicles to the standalone pools.
; Back up any existing dinput8.dll before installing this proxy.
