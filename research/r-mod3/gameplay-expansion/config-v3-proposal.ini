; Research proposal only. The published beta accepts ConfigVersion=2.
; Do not use this file with the current release; no v3 parser exists.
; All v3-only keys below are unsupported by the published beta.
; Proposed strict parser: reject the whole config on unknown keys, duplicate
; keys/sections, malformed values, invalid IDs or size overflow. Do not
; partially apply settings; fall back to documented native behavior.
; IDs below are physical CarIDs, not class-local menu ordinals.

[General]
ConfigVersion = 3

[Randomizer]
Enabled = true
; Numeric values preserve ConfigVersion=2 meanings:
; 0=Stock  1=T1  2=T2  3=T3  4=Full  5=Mixed  6=Diverse
; Full remains 4. A mode value overrides Default for that new event only.
Default = 0
QuickRace = 4
RallyeCup = 0
MasterRallye = 0
Invitation = 0
Challenge = 0

[Player]
; None preserves the native Vehicle Select / authored event car.
ForcedCarID = None
; Player randomization uses the corresponding Randomizer mode only when enabled.
Randomize = false
; Optional per-mode override; None inherits ForcedCarID / Randomize policy.
QuickRaceForcedCarID = None
RallyeCupForcedCarID = None
MasterRallyeForcedCarID = None
InvitationForcedCarID = None
ChallengeForcedCarID = None

[Opponents]
; This is the menu/configuration ceiling, not the exact race count.
Enabled = true
MaxOpponents = 5
; Exact count is the selected UI value for Quick Race. Other modes remain
; native until their count owner and persistence are individually qualified.
RallyeCupCount = Native
MasterRallyeCount = Native
InvitationCount = Native
ChallengeCount = Native

[ForcedRoster]
; Per-participant physical IDs. None delegates that slot to Randomizer/native.
; One-human Quick Race uses human Car0 and AI Car1..Car7. Other modes and
; SplitScreen need a proven participant-role map before these keys apply.
; A forced slot outranks AI Randomizer only in a qualified mode.
Car1 = None
Car2 = None
Car3 = None
Car4 = None
Car5 = None
Car6 = None
Car7 = None

[StartingGrid]
; Native keeps course-authored order. Reorder is a proposed grid-ordinal
; permutation only; it never changes physical CarID or participant ownership.
Mode = Native
; Order lists participant slots in desired grid order, not physical CarIDs.
; Example: Order = 0,2,1,3 means Car0 starts first, then Car2, etc.
; Do not apply until the course is qualified.
Order = Native

[Addons]
; Include only explicit runtime-registered addon IDs in a future adapter.
Include = None

[Logging]
Enabled = false

; Proposed precedence:
; player: per-mode ForcedCarID > global ForcedCarID > Player.Randomize > native
; AI slot: ForcedRoster.CarN > mode Randomizer policy > native chooser
; invalid/inactive ID: reject this override before preview/roster publication,
; keep native mode behavior and emit a specific diagnostic.
; Counts, IDs, and grid order freeze at the new event/roster boundary.
